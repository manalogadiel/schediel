openapi: 3.1.0
info:
  title: Schediel backend API
  version: 1.0.0
  description: >-
    Frozen v1 transport contract for share snapshots, gated cloud scanning, backend-data deletion and
    health (SCHEDULER_SPEC.md sections 13-16, CONTRACTS.md sections 5 and 7). Implemented as Supabase
    Edge Functions under backend/. Nothing here is deployed by this repository; link sharing stays off in
    the app until a project and an owned share domain are configured. Cloud scanning is gated off until
    the audience, provider, privacy and budget decisions are approved; its endpoints answer
    503 scan_unavailable while the gate is closed.
servers:
  - url: "{supabaseUrl}/functions/v1"
    variables:
      supabaseUrl:
        default: https://PROJECT_REF.supabase.co
        description: Supabase project URL configured at deployment.
security: []
tags:
  - name: share-links
  - name: share-resolve
  - name: scan
  - name: privacy
  - name: health
paths:
  /share-links:
    post:
      tags: [share-links]
      operationId: createShareLink
      summary: Create an immutable share snapshot from a client-held bearer secret digest.
      description: >-
        The client generates 32 random bytes, stores them in protected local storage, and sends only the
        lowercase hex SHA-256 digest. The response never contains the secret or a complete bearer URL; the
        client composes https://{shareHost}/s/#{base64url secret}; legacy routePath links remain readable. Ownership comes from the
        verified session, never from the request body. A replay with the same Idempotency-Key and the same
        request hash returns the original outcome without repeating work.
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShareLinkRequest' }
      responses:
        '201':
          description: Created, or the original outcome of an identical replay.
          headers:
            Idempotent-Replayed:
              description: "'true' when this response replays an earlier identical request."
              schema: { type: string, enum: ['true', 'false'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    get:
      tags: [share-links]
      operationId: listShareLinks
      summary: List the caller's share links (metadata only).
      security:
        - ownerSession: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: One page of owner metadata, newest first. No secrets, digests or payloads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLinkPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /share-links/{shareId}:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    get:
      tags: [share-links]
      operationId: getShareLink
      summary: Exact owner status, used for revoke read-back.
      security:
        - ownerSession: []
      responses:
        '200':
          description: Owner metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [share-links]
      operationId: revokeShareLink
      summary: Idempotently revoke future retrieval. Never touches recipient copies.
      security:
        - ownerSession: []
      responses:
        '200':
          description: Revoked (or already revoked) owner metadata with revokedAt set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /share-resolve:
    post:
      tags: [share-resolve]
      operationId: resolveSharePreview
      summary: Read-only resolution of a bearer link. Never imports, creates identities, alerts or scans.
      description: >-
        Public and rate-limited. The token comes from the URL fragment and is sent only in this body.
        Malformed tokens are rejected before lookup. Unknown share IDs and wrong tokens are both 404.
        Expired or revoked states (410) and schema mismatch (422) are disclosed only after the token matches.
        Responses carry Cache-Control: no-store, private and Referrer-Policy: no-referrer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveShareRequest' }
      responses:
        '200':
          description: Permitted snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedShare' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /scan/assets:
    post:
      tags: [scan]
      operationId: createScanAsset
      summary: Gated. Returns 503 scan_unavailable until cloud scanning is approved and configured.
      security:
        - ownerSession: []
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /scan/assets/{assetId}:
    delete:
      tags: [scan]
      operationId: deleteScanAsset
      summary: Gated. Returns 503 scan_unavailable until cloud scanning is approved and configured.
      security:
        - ownerSession: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /scan/jobs:
    post:
      tags: [scan]
      operationId: createScanJob
      summary: Gated. Returns 503 scan_unavailable until cloud scanning is approved and configured.
      security:
        - ownerSession: []
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /scan/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [scan]
      operationId: getScanJob
      summary: Gated. Returns 503 scan_unavailable until cloud scanning is approved and configured.
      security:
        - ownerSession: []
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [scan]
      operationId: cancelScanJob
      summary: Gated. Returns 503 scan_unavailable until cloud scanning is approved and configured.
      security:
        - ownerSession: []
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /privacy/delete-backend-data:
    post:
      tags: [privacy]
      operationId: deleteBackendData
      summary: Queue revocation and deletion of the caller's backend data. Local schedules are untouched.
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm:
                  type: string
                  const: delete-backend-data
      responses:
        '202':
          description: Deletion accepted; read progress from the returned job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /privacy/deletion-jobs/{jobId}:
    get:
      tags: [privacy]
      operationId: getDeletionJob
      summary: Read deletion progress for the caller's own job.
      security:
        - ownerSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deletion progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionJob' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Minimal availability check without secrets, addresses or personal data.
      responses:
        '200':
          description: Available.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
components:
  securitySchemes:
    ownerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase Auth access token of an anonymous (or later permanent) user. Requests also send the
        project's publishable key in the apikey header. Anonymous users hold the authenticated role;
        ownership is derived from the verified token subject only.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, scoped to identity and route. Retained for 24 hours.
      schema: { type: string, format: uuid }
    ShareId:
      name: shareId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Safe error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - idempotency_key_required
            - idempotency_mismatch
            - idempotency_expired
            - invalid_token
            - link_expired
            - link_revoked
            - unsupported_schema_version
            - payload_too_large
            - unsupported_media_type
            - rate_limited
            - quota_exceeded
            - scan_unavailable
            - internal_error
            - service_unavailable
        message:
          type: string
          maxLength: 300
          description: Safe interface text. Never contains secrets, payload text or stack traces.
        requestId: { type: string, maxLength: 64 }
        fieldErrors:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FieldError' }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 0 }
    FieldError:
      type: object
      additionalProperties: false
      required: [path, code]
      properties:
        path:
          type: string
          maxLength: 200
          description: JSON Pointer into the request body.
        code:
          type: string
          description: One of the x-errorCodes of share-payload-v1.schema.json, or invalid_value for envelope fields.
    CreateShareLinkRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, payload, tokenDigest, expiresAt]
      properties:
        schemaVersion: { type: string, const: '1.0' }
        payload:
          $ref: 'schemas/share-payload-v1.schema.json'
        tokenDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the 32 raw secret bytes.
        expiresAt:
          type: string
          format: date-time
          description: >-
            Requested expiry. The server accepts values from server time + 1 hour through server time +
            7 days (5-minute tolerance) and stores its own validated instant. The app offers 1 day and
            7 days (default); longer or no-expiry choices are not approved.
    ShareLink:
      type: object
      additionalProperties: false
      required: [shareId, snapshotVersion, routePath, createdAt, expiresAt, revokedAt, itemCount, categoryLabels]
      properties:
        shareId: { type: string, format: uuid }
        snapshotVersion: { type: integer, minimum: 1 }
        routePath:
          type: string
          pattern: '^/s/[0-9a-f-]{36}$'
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        itemCount: { type: integer, minimum: 1, maximum: 250 }
        categoryLabels:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
          description: Distinct non-null category labels computed by the server from the stored payload.
    ShareLinkPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ShareLink' }
        nextCursor: { type: [string, 'null'] }
    ResolveShareRequest:
      type: object
      additionalProperties: false
      description: Compact links omit shareId and resolve by the full capability digest; legacy links provide shareId as an additional scope.
      required: [token, supportedSchemaVersions]
      properties:
        shareId: { type: string, format: uuid }
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Canonical unpadded base64url of exactly 32 bytes; non-canonical encodings are invalid_token.
        supportedSchemaVersions:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, maxLength: 10 }
    ResolvedShare:
      type: object
      additionalProperties: false
      required: [shareId, schemaVersion, snapshotVersion, createdAt, expiresAt, itemCount, payload]
      properties:
        shareId: { type: string, format: uuid }
        schemaVersion: { type: string, const: '1.0' }
        snapshotVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        itemCount: { type: integer, minimum: 1, maximum: 250 }
        payload:
          $ref: 'schemas/share-payload-v1.schema.json'
    DeletionJob:
      type: object
      additionalProperties: false
      required: [deletionJobId, status, requestedAt, completedAt, revokedShareCount, deletedShareCount]
      properties:
        deletionJobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        revokedShareCount: { type: integer, minimum: 0 }
        deletedShareCount: { type: integer, minimum: 0 }
